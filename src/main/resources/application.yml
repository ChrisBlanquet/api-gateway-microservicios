server:
  port: 9000
  address: 0.0.0.0

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # --- CONFIGURACIÓN DE RESILIENCIA ---
      httpclient:
        connect-timeout: 10000
        response-timeout: 10s
        
      # --- RUTEO DE MICROSERVICIOS (MVC) ---
      server:
        webmvc:
          routes:
            # 1. Autenticación
            - id: auth-service
              uri: lb://AUTH
              predicates:
                - Path=/api/auth/**

            # 2. LIBRERIA (Convenios y Cuadrillas)
            - id: convenios-service
              uri: lb://LIBRERIA
              predicates:
                - Path=/api/cuadrillas/**, /api/personal/**, /api/departamentos/**, /api/test-bot/**
            
            # 3. Ubicaciones
            - id: servicio-ubicacion
              uri: lb://UBICACION
              predicates:
                - Path=/api/ubicaciones/**

            # 4. Gestión Institucional
            - id: servicio-gestion
              uri: lb://SERVICIO-GESTION-INSTITUCIONAL
              predicates:
                - Path=/api/gestion/**

            # 5. Incidencias
            - id: servicio-incidencias
              uri: lb://SERVICIOINCIDENCIAS
              predicates:
                - Path=/api/incidencias/**

            # 6. Notificaciones
            - id: servicio-notificaciones
              uri: lb://NOTIFICACIONES
              predicates:
                - Path=/api/notificaciones/**

            # 7. Evidencias
            - id: servicio-evidencias
              uri: lb://SERVICIO-EVIDENCIAS
              predicates:
                - Path=/api/evidencias/**

            # 8. Comentarios y Seguimiento
            - id: servicio-comentarios-seguimiento
              uri: lb://COMENTARIOS-SEGUIMIENTO
              predicates:
                - Path=/api/comentarios/**

            # 9. Reportes
            - id: servicio-reportes
              uri: lb://REPORTES
              predicates:
                - Path=/api/reportes/**

# ---(EUREKA) ---
eureka:
  instance:
    prefer-ip-address: true
    #ip-address: ${azure-public-ip}
    #instance-id: ${spring.application.name}:${eureka.instance.ip-address}:${server.port} 
    instance-id: ${spring.application.name}:${random.value}
  client:
    fetch-registry: true
    register-with-eureka: true
    serviceUrl:
      defaultZone: http://${azure-public-ip}:8761/eureka/